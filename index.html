<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gangskjerm</title>
<style>
  :root {
    --bg: #0b121a; --card: #152130; --card2: #1b2a3c; --line: #27384c;
    --text: #f4f8fb; --muted: #9bb0c5; --faint: #4d6277;
    --accent: #ffd166; --good: #5fe39a; --warn: #ff8a7a; --rain: #5aaeff;
    --metro: #ff7a3d; --bus: #4fa3ff; --ink: #0b121a;
  }
  body.dim {
    --bg: #05080c; --card: #0b1118; --card2: #0f1620; --line: #16202b;
    --text: #94a4b4; --muted: #576779; --faint: #2c3947;
    --accent: #b99555; --good: #5aa57c; --warn: #b5675d; --rain: #43739f;
    --metro: #a2542c; --bus: #34678f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor: none;
    font-variant-numeric: tabular-nums; }
  body.dim svg { opacity: .6; }
  .screen { display: flex; flex-direction: column; height: 100vh; padding: 2.2vh 2vw; }
  .upper { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .lower { display: flex; flex: none; height: 33vh; margin-top: 1.6vh; }
  .transit { flex: none; width: 44vw; display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; margin-left: 1.6vw; }

  /* ---------- Topp ---------- */
  .top { display: flex; justify-content: space-between; align-items: center; height: 12vh; color: var(--muted); font-size: 2.8vh; }
  .top .place { flex: none; }
  .top .warn { color: var(--warn); font-size: 2.4vh; text-align: center; -webkit-box-flex: 1; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { flex: none; text-align: right; font-size: 13vh; line-height: 1; color: var(--text); font-weight: 700; letter-spacing: -.01em; }
  .flagday { flex: none; display: flex; align-items: center; margin: 0 2vw; }
  .flagday svg { width: 11vh; height: 8vh; display: block; margin-right: 1.2vw; flex: none; }
  .flagday b { display: block; color: var(--text); font-size: 4vh; font-weight: 700; line-height: 1.1; }
  .flagday span { display: block; color: var(--muted); font-size: 2.6vh; line-height: 1.3; }

  /* ---------- Været nå ---------- */
  .now { display: flex; align-items: center; height: 29vh; margin-top: .6vh; }
  .now .icon { width: 24vh; height: 24vh; margin-right: 1.4vw; flex: none; }
  .now .icon svg { width: 100%; height: 100%; display: block; }
  .now .temp { font-size: 25vh; font-weight: 700; line-height: 1; white-space: nowrap; letter-spacing: -.02em; }
  .now .temp small { font-size: 10vh; color: var(--muted); font-weight: 400; vertical-align: top; position: relative; top: 1.5vh; }
  .now .meta { margin-left: 2vw; font-size: 3.6vh; color: var(--muted); line-height: 1.45; min-width: 0; }
  .now .meta b { display: block; color: var(--text); font-weight: 600; font-size: 4.6vh; }
  .now .kid { margin-left: auto; flex: none; width: 19.7vh; height: 28.8vh; }
  .now .kid svg { width: 100%; height: 100%; display: block; }

  /* ---------- Handling ---------- */
  .advice { margin: 1.4vh 0 0; padding: 1.6vh 1.6vw; border-radius: 1.6vh; background: var(--card); -webkit-box-flex: 1; flex: 1; min-height: 0;
    border-left: 1vh solid var(--faint); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .advice.rain { border-left-color: var(--rain); }
  .advice.cold { border-left-color: #9ad0ff; }
  .advice.ok { border-left-color: var(--good); }
  .advice .a1 { font-size: 6vh; font-weight: 700; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a2 { font-size: 3.8vh; color: var(--muted); margin-top: .8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a1 .ic { display: inline-block; width: 6.6vh; height: 6.6vh; vertical-align: -1.2vh; margin-right: .8vw; }

  /* ---------- Timestripe ---------- */
  .hours { -webkit-box-flex: 1; flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-gap: .6vw; min-height: 0; }
  .hour { background: var(--card); border-radius: 1.2vh; display: flex; flex-direction: column;
    align-items: center; padding: 1vh .1vw 1vh; min-width: 0; }
  .hour.wet { background: var(--card2); }
  .hour .h { font-size: 2.6vh; color: var(--muted); height: 3.2vh; }
  .hour .i { width: 5.6vh; height: 5.6vh; margin: .4vh 0; }
  .hour .i svg { width: 100%; height: 100%; display: block; }
  .hour .t { font-size: 3.4vh; font-weight: 700; height: 4.2vh; }
  .hour .blk { -webkit-box-flex: 1; flex: 1; width: 88%; margin-top: .8vh; border-radius: .9vh; background: rgba(120,150,180,.10);
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  .hour .blk .v { font-size: 3.3vh; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .hour .blk .u { font-size: 2vh; color: var(--muted); line-height: 1.2; white-space: nowrap; }
  .hour .blk svg { width: 3.6vh; height: 3.6vh; display: block; margin-bottom: .3vh; }
  .hour .rain .v { color: var(--rain); }
  .hour .rain.zero { background: transparent; }
  .hour .rain.zero .v, .hour .rain.zero .u { color: var(--faint); font-weight: 500; }
  .hour .rain.wetb { background: rgba(79,163,255,.18); }
  .hour .wind .v { color: var(--text); }
  .hour .wind.breezy .v, .hour .wind.breezy svg { color: var(--accent); }
  .hour .wind.stormy .v, .hour .wind.stormy svg { color: var(--warn); }
  .hour .wind svg { color: var(--muted); }
  .hours .none { grid-column: 1 / -1; color: var(--muted); font-size: 3vh; padding: 3vh 1vw; background: var(--card); border-radius: 1.2vh; }

  /* ---------- Avganger ---------- */
  .board { background: var(--card); border-radius: 1.6vh; padding: 1.2vh 1.4vw 1vh; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .board h2 { display: flex; align-items: center; font-size: 3.2vh; font-weight: 700; height: 4.6vh; flex: none; }
  .badge { display: inline-block; min-width: 5vh; text-align: center; padding: .3vh 1vh; border-radius: .9vh; color: var(--ink); font-weight: 800; font-size: 3vh; margin-right: .9vw; }
  body.dim .badge { color: #05080c; }
  .badge.metro { background: var(--metro); } .badge.bus { background: var(--bus); }
  .board h2 .sub { color: var(--muted); font-weight: 400; font-size: 2.4vh; margin-left: .8vw; white-space: nowrap; }
  .board h2 .walk { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 2.4vh; white-space: nowrap; }
  .rows { -webkit-box-flex: 1; flex: 1; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); grid-gap: .5vh; margin-top: 1vh; min-height: 0; }
  .row { display: flex; align-items: center; padding: 0 .9vw; border-radius: 1vh; border-left: .8vh solid transparent; min-height: 0; overflow: hidden; }
  .row .when { width: 20vh; font-size: 4.6vh; font-weight: 700; white-space: nowrap; line-height: 1; }
  .row .det { -webkit-box-flex: 1; flex: 1; min-width: 0; font-size: 2.5vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .row .det .rt { color: var(--good); }
  .row .go { font-size: 3.2vh; font-weight: 800; white-space: nowrap; text-align: right; margin-left: 1vw; }
  .row.target { background: rgba(95,227,154,.14); border-left-color: var(--good); }
  .row.target .when { font-size: 5.6vh; color: var(--good); }
  .row.target .det { color: var(--text); }
  .row.target.gonow { background: rgba(255,209,102,.18); border-left-color: var(--accent); }
  .row.target.gonow .when, .row.target.gonow .go { color: var(--accent); }
  .row.target .go { color: var(--good); }
  .row .go small { display: block; font-size: 2.3vh; font-weight: 400; color: var(--muted); line-height: 1.3; }
  .row.missed { opacity: .38; }
  .row.missed .go { font-weight: 500; font-size: 2.3vh; }
  .row.cancel .when { text-decoration: line-through; color: var(--warn); }
  .row.cancel .go { color: var(--warn); font-size: 2.6vh; }
  .row.cancel { opacity: .85; }
  .row.empty .det { font-size: 2.8vh; }
  .board.old .rows { opacity: .35; }
</style>
</head>
<body>
<div class="screen">
  <section class="upper">
    <div class="top"><div class="place" id="place">Hjemme</div><div class="flagday" id="flagday"></div><div class="warn" id="stale"></div><div class="clock" id="clock">--:--</div></div>
    <div class="now">
      <div class="icon" id="nowIcon"></div>
      <div class="temp"><span id="nowTemp">--</span><small>°</small></div>
      <div class="meta" id="nowMeta"></div>
      <div class="kid" id="kid"></div>
    </div>
    <div class="advice" id="advice"><div class="a1">Henter vær …</div><div class="a2"></div></div>
  </section>

  <section class="lower">
    <div class="hours" id="hours"></div>
    <div class="transit">
      <div class="board" id="b-hauger"><h2><span class="badge metro">3</span>Hauger<span class="sub">mot sentrum</span><span class="walk"></span></h2><div class="rows"></div></div>
    </div>
  </section>
</div>

<script>
// ===== Konfigurasjon =====
// walk = gåtid i minutter fra døra til holdeplassen. Avganger du ikke rekker dempes,
// og første du rekker fremheves med "Gå om N min". Sett walk: 0 for å skru av.
var CFG = {
  lat: 59.92, lon: 10.51,                     // Bærum (avrundet)
  clientName: 'privat-gangskjerm',            // Entur ber om et navn på klienten
  boards: [
    { el: 'b-hauger',   stop: 'NSR:StopPlace:58283', quay: 'NSR:Quay:7305', n: 4, walk: 8 }                     // Hauger, T3 mot Oslo
  ],
  rows: 3,                                    // antall avgangsrader (må matche grid i .rows)
  hoursShown: 10,                             // maks antall timer i timestripen
  dimFrom: 22, dimTo: 6,                      // dimmet visning om natten
  staleAfterMin: 4                            // avganger eldre enn dette markeres som utdatert
};

// Demo: ?demo=1 (regn), ?demo=fog | snow | clear | night | cancel | error | thunder, valgfritt &temp=-5 for å overstyre temperatur
var DEMO = (function () { var m = /[?&]demo=([^&]*)/.exec(location.search); return m ? (m[1] === '1' ? 'rain' : m[1]) : ''; })();

function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var fails = { weather: 0, transit: 0 };
var lastOk = { weather: 0, transit: 0 };

// ===== Klokke + dimming =====
// ===== Flaggdager (offisielle, jf. forskrift om flagging) =====
var FLAGTEST = (function () { var m = /[?&]flag=(\d{4}-\d{2}-\d{2})/.exec(location.search); return m ? m[1] : ''; })();
var FIXED_FLAG = { '1-1': 'Nyttårsdag', '1-21': 'Prinsesse Ingrid Alexandras fødselsdag', '2-6': 'Samefolkets dag',
  '2-21': 'Kong Haralds fødselsdag', '5-1': 'Offentlig høytidsdag', '5-8': 'Frigjøringsdagen', '5-17': 'Grunnlovsdagen',
  '6-7': 'Unionsoppløsningen 1905', '7-4': 'Dronning Sonjas fødselsdag', '7-20': 'Kronprins Haakons fødselsdag',
  '7-29': 'Olsok', '8-19': 'Kronprinsesse Mette-Marits fødselsdag', '12-25': '1. juledag' };
function easterSunday(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function flagDayName(d) {
  var y = d.getFullYear(), n = FIXED_FLAG[(d.getMonth() + 1) + '-' + d.getDate()];
  if (n) return n;
  var e = easterSunday(y);
  if (sameDay(d, e)) return '1. påskedag';
  if (sameDay(d, new Date(y, e.getMonth(), e.getDate() + 49))) return '1. pinsedag';
  // Stortingsvalg: andre mandag i september, hvert fjerde år (2025, 2029, ...)
  if (y >= 2025 && (y - 2025) % 4 === 0 && d.getMonth() === 8) {
    var first = 1 + ((8 - new Date(y, 8, 1).getDay()) % 7);
    if (d.getDate() === first + 7) return 'Stortingsvalget';
  }
  return '';
}
var flagShown = null;
function renderFlag(d) {
  var test = FLAGTEST ? new Date(FLAGTEST + 'T12:00:00') : d, name = flagDayName(test);
  if (name === flagShown) return;
  flagShown = name;
  var mo = test.getMonth(), hoist = (mo >= 2 && mo <= 9) ? '08' : '09';
  $('flagday').innerHTML = name ? '<svg viewBox="0 0 22 16"><rect width="22" height="16" rx="1" fill="#ba0c2f"/><rect x="6" width="4" height="16" fill="#fff"/><rect y="6" width="22" height="4" fill="#fff"/><rect x="7" width="2" height="16" fill="#00205b"/><rect y="7" width="22" height="2" fill="#00205b"/></svg>' +
    '<div><b>Flaggdag</b><span>' + name + ' · heis kl. ' + hoist + '</span></div>' : '';
}

function tick() {
  var d = new Date();
  $('clock').textContent = hhmm(d);
  renderFlag(d);
  var h = d.getHours();
  var dim = DEMO === 'night' || (h >= CFG.dimFrom || h < CFG.dimTo);
  document.body.className = dim ? 'dim' : '';
  renderTimes(); updateStale();
}

// ===== Værikoner (inline SVG, ser lik ut på alle enheter) =====
function sunSvg(cx, cy, r) {
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffd166"/>', i, a, x1, y1, x2, y2;
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4; x1 = cx + Math.cos(a) * (r + 4); y1 = cy + Math.sin(a) * (r + 4);
    x2 = cx + Math.cos(a) * (r + 9); y2 = cy + Math.sin(a) * (r + 9);
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#ffd166" stroke-width="3.2" stroke-linecap="round"/>';
  }
  return s;
}
function moonSvg(cx, cy) {
  return '<path transform="translate(' + (cx - 20) + ' ' + (cy - 20) + ')" d="M24 3a17 17 0 1 0 13 28 14 14 0 0 1-13-28z" fill="#e6e0b8"/>';
}
function cloudSvg(x, y, s, fill) {
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M14 40a9 9 0 0 1 1-18 12 12 0 0 1 23-2 10 10 0 0 1 2 20z" fill="' + fill + '"/></g>';
}
function dropsSvg(n, color) {
  var xs = n === 1 ? [30] : (n === 2 ? [24, 36] : [20, 31, 42]), s = '', i;
  for (i = 0; i < xs.length; i++) s += '<line x1="' + (xs[i] + 2) + '" y1="49" x2="' + (xs[i] - 2) + '" y2="58" stroke="' + color + '" stroke-width="3.6" stroke-linecap="round"/>';
  return s;
}
function flakesSvg(n) {
  var xs = n === 1 ? [32] : (n === 2 ? [25, 39] : [20, 32, 44]), s = '', i;
  for (i = 0; i < xs.length; i++) s += '<circle cx="' + xs[i] + '" cy="' + (i % 2 ? 57 : 52) + '" r="3" fill="#e8f2ff"/>';
  return s;
}
function parseCode(code) {
  var c = code || '', night = /_night$/.test(c), b = c.replace(/_(day|night|polartwilight)$/, '');
  var thunder = /thunder/.test(b), showers = /showers/.test(b);
  b = b.replace(/showers|andthunder/g, '');
  var lvl = /^light/.test(b) ? 1 : (/^heavy/.test(b) ? 3 : 2);
  b = b.replace(/^(light|heavy)/, '');
  return { k: b, lvl: lvl, night: night, thunder: thunder, showers: showers };
}
function iconSvg(code) {
  var p = parseCode(code), g = '', gray = '#aebccb', dark = '#7d8ea1', sun = p.night ? moonSvg(24, 24) : sunSvg(24, 24, 9);
  switch (p.k) {
    case 'clearsky': g = p.night ? moonSvg(32, 32) : sunSvg(32, 32, 13); break;
    case 'fair': g = sun + cloudSvg(14, 14, 1.0, gray); break;
    case 'partlycloudy': g = sun + cloudSvg(8, 12, 1.2, gray); break;
    case 'cloudy': g = cloudSvg(14, 6, .9, dark) + cloudSvg(2, 12, 1.2, gray); break;
    case 'fog': g = cloudSvg(4, 0, 1.2, gray) + '<g stroke="#c4d0dc" stroke-width="3.4" stroke-linecap="round"><line x1="12" y1="46" x2="52" y2="46"/><line x1="18" y1="53" x2="56" y2="53"/><line x1="10" y1="60" x2="46" y2="60"/></g>'; break;
    case 'rain': case 'sleet': case 'snow':
      var base = p.showers ? sun + cloudSvg(8, 8, 1.15, dark) : cloudSvg(4, 0, 1.2, p.lvl === 3 || p.thunder ? dark : gray);
      if (p.k === 'rain') g = base + dropsSvg(p.lvl, '#5aaeff');
      else if (p.k === 'snow') g = base + flakesSvg(p.lvl);
      else g = base + dropsSvg(1, '#5aaeff') + '<circle cx="42" cy="55" r="3" fill="#e8f2ff"/>';
      break;
    default: g = cloudSvg(4, 6, 1.2, gray);
  }
  if (p.thunder) g += '<path d="M34 40l-9 14h7l-3 10 12-16h-8z" fill="#ffd166"/>';
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}
var TEXT = { clearsky: 'Klarvær', fair: 'Lettskyet', partlycloudy: 'Delvis skyet', cloudy: 'Skyet', fog: 'Tåke',
  rain: 'Regn', sleet: 'Sludd', snow: 'Snø' };
function label(code) {
  var p = parseCode(code);
  if (p.thunder) return 'Torden';
  var t = TEXT[p.k] || '';
  if (p.k === 'rain' || p.k === 'sleet' || p.k === 'snow') {
    if (p.showers) return (p.lvl === 1 ? 'Lette ' : p.lvl === 3 ? 'Kraftige ' : '') + (p.k === 'rain' ? 'regnbyger' : p.k === 'snow' ? 'snøbyger' : 'sluddbyger');
    if (p.lvl === 1) return 'Lett ' + t.toLowerCase();
    if (p.lvl === 3) return 'Mye ' + t.toLowerCase();
  }
  return t;
}

// ===== Vær (MET / Yr) =====
var weatherData = null;
function loadWeather() {
  fetch('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=' + CFG.lat + '&lon=' + CFG.lon)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { weatherData = j.properties.timeseries; fails.weather = 0; lastOk.weather = Date.now(); renderWeather(); updateStale(); })
    .catch(function () { fails.weather++; updateStale(); renderWeather(); });
}
function precipOf(x) { return (x.data.next_1_hours.details.precipitation_amount || 0); }

// Kort, handlingsrettet setning ut fra de neste timene
function makeAdvice(ts, until, now, d, code) {
  var rainNow = false, first = null, firstKind = '', i, p, k, snowy = /snow|sleet/.test(parseCode(code).k);
  var horizon = until.slice(0, 6), maxWind = d.wind_speed || 0, minT = d.air_temperature;
  for (i = 0; i < horizon.length; i++) {
    p = precipOf(horizon[i]);
    if (p >= 0.2 && !first) { first = horizon[i]; firstKind = parseCode(horizon[i].data.next_1_hours.summary.symbol_code).k; }
    if (horizon[i].data.instant.details.air_temperature < minT) minT = horizon[i].data.instant.details.air_temperature;
    if (horizon[i].data.instant.details.wind_speed > maxWind) maxWind = horizon[i].data.instant.details.wind_speed;
  }
  var kind = 'ok', a1, tNow = Math.round(d.air_temperature), a2;
  var noun = (firstKind === 'snow' || (!first && snowy)) ? 'snø' : (firstKind === 'sleet' ? 'sludd' : 'regn');
  var rainIcon = '<span class="ic">' + iconSvg(noun === 'snø' ? 'snow' : 'rain') + '</span>';
  if (first) {
    var startsNow = new Date(first.time).getTime() - now.getTime() < 3600e3;
    kind = 'rain';
    var fromH = 'kl. ' + pad(new Date(first.time).getHours());
    a1 = rainIcon + (noun === 'snø' ? (startsNow ? 'Det snør nå' : 'Snø fra ' + fromH) : 'Ta med paraply – ' + (startsNow ? noun + ' nå' : noun + ' fra ' + fromH));
  } else if (/fog/.test(parseCode(code).k)) {
    a1 = '<span class="ic">' + iconSvg('fog') + '</span>Tåke – ta det med ro ute';
  } else {
    a1 = '<span class="ic">' + iconSvg(parseCode(code).night ? 'clearsky_night' : 'clearsky_day') + '</span>Tørt de neste timene';
  }
  if (minT <= -8) { kind = kind === 'rain' ? 'rain' : 'cold'; a2 = 'Veldig kaldt: dunjakke, lue og votter'; }
  else if (minT <= 0) { if (kind !== 'rain') kind = 'cold'; a2 = 'Frost: vinterjakke og lue'; }
  else if (minT <= 7) a2 = 'Kaldt: ta ordentlig jakke';
  else if (minT <= 13) a2 = 'Ta en lett jakke';
  else if (minT <= 18) a2 = 'Tynn jakke eller genser holder';
  else a2 = 'Ingen jakke nødvendig';
  if (maxWind >= 10) a2 += ' · det blåser (' + Math.round(maxWind) + ' m/s)';
  return { kind: kind, a1: a1, a2: a2, minT: minT, wet: !!first, snow: noun === 'snø', wind: maxWind,
    sunny: !first && !parseCode(code).night && /clearsky|fair/.test(parseCode(code).k) };
}
// Barn som viser hva man bør ha på seg (tilpasses temperatur, nedbør og vind)
function kidSvg(a) {
  var m = a.minT, wet = a.wet, lvl = m <= 0 ? 'frost' : (m <= 7 ? 'cold' : (m <= 13 ? 'cool' : (m <= 18 ? 'mild' : 'warm')));
  var skin = '#f2c9a0', pants = '#3f5a8a', top, hat = '', short = false, boots = false, hood = false, mitt = false, scarf = false, puffy = false, g = '';
  if (lvl === 'frost') { top = '#3a6fd8'; pants = '#2d3a4f'; boots = true; mitt = true; scarf = true; puffy = true; hat = '#e63946'; }
  else if (lvl === 'cold') { top = '#f08a24'; pants = '#2d3a4f'; boots = true; hat = '#1fa39a'; puffy = true; }
  else if (lvl === 'cool') { top = '#4cae6a'; }
  else if (lvl === 'mild') { top = '#8e6bd1'; }
  else { top = '#ff6b6b'; short = true; if (a.sunny) hat = 'cap'; }
  if (wet) { top = '#ffd23f'; boots = 'rubber'; if (lvl === 'cool' || lvl === 'mild' || lvl === 'warm') { hood = true; hat = ''; } }
  var sleeveH = short ? 14 : 38;
  // regnhette bak hodet
  if (hood) g += '<circle cx="50" cy="29" r="21" fill="#ffd23f"/>';
  // bein
  if (short) g += '<rect x="37" y="104" width="9" height="28" rx="4" fill="' + skin + '"/><rect x="54" y="104" width="9" height="28" rx="4" fill="' + skin + '"/>' +
    '<rect x="35" y="88" width="13" height="20" rx="5" fill="' + pants + '"/><rect x="52" y="88" width="13" height="20" rx="5" fill="' + pants + '"/>';
  else g += '<rect x="35" y="88" width="13" height="46" rx="5" fill="' + pants + '"/><rect x="52" y="88" width="13" height="46" rx="5" fill="' + pants + '"/>';
  // sko
  if (boots) { var bc = boots === 'rubber' ? '#ffc400' : '#3b3b46'; g += '<rect x="34" y="114" width="15" height="26" rx="4" fill="' + bc + '"/><rect x="51" y="114" width="15" height="26" rx="4" fill="' + bc + '"/>'; }
  else g += '<rect x="32" y="130" width="17" height="10" rx="5" fill="#f4f6f8"/><rect x="51" y="130" width="17" height="10" rx="5" fill="#f4f6f8"/><rect x="32" y="137" width="17" height="3" rx="1.5" fill="#c5ccd4"/><rect x="51" y="137" width="17" height="3" rx="1.5" fill="#c5ccd4"/>';
  // armer (hud under korte ermer)
  if (short) g += '<rect x="22.5" y="58" width="8" height="28" rx="4" fill="' + skin + '"/><rect x="69.5" y="58" width="8" height="28" rx="4" fill="' + skin + '"/>';
  // overkropp
  var tx = puffy ? 29 : 31, tw = puffy ? 42 : 38;
  g += '<rect x="' + tx + '" y="46" width="' + tw + '" height="46" rx="9" fill="' + top + '"/>';
  g += '<rect x="' + (puffy ? 20 : 21) + '" y="49" width="12" height="' + sleeveH + '" rx="6" fill="' + top + '"/><rect x="' + (puffy ? 68 : 67) + '" y="49" width="12" height="' + sleeveH + '" rx="6" fill="' + top + '"/>';
  if (lvl === 'cold' || lvl === 'frost' || wet || lvl === 'cool') g += '<rect x="49" y="50" width="2" height="42" fill="rgba(0,0,0,.18)"/>';
  if (puffy) g += '<path d="M31 62 H69 M31 76 H69" stroke="rgba(0,0,0,.14)" stroke-width="1.5"/>';
  // hender
  g += '<circle cx="26" cy="' + (short ? 87 : 89) + '" r="5.5" fill="' + (mitt ? '#e63946' : skin) + '"/><circle cx="74" cy="' + (short ? 87 : 89) + '" r="5.5" fill="' + (mitt ? '#e63946' : skin) + '"/>';
  // hals, skjerf, hode
  g += '<rect x="45" y="40" width="10" height="9" fill="' + skin + '"/>';
  if (scarf) g += '<rect x="34" y="42" width="32" height="9" rx="4.5" fill="#f4f6f8"/><rect x="56" y="48" width="7" height="16" rx="3" fill="#f4f6f8"/>';
  g += '<circle cx="50" cy="28" r="15" fill="' + skin + '"/>';
  if (!hat && !hood) g += '<path d="M34 26 Q33 10 50 10 Q67 10 66 26 Q59 19 50 20 Q41 19 34 26 Z" fill="#6b4a2f"/>';
  if (hood) g += '<path d="M33 26 Q32 8 50 8 Q68 8 67 26 Q60 17 50 17 Q40 17 33 26 Z" fill="#ffd23f"/>';
  g += '<circle cx="44" cy="29" r="1.8" fill="#2b2b2b"/><circle cx="56" cy="29" r="1.8" fill="#2b2b2b"/>' +
    '<path d="M44 35 Q50 40 56 35" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
    '<circle cx="40" cy="34" r="2.6" fill="#f2a58e" opacity=".6"/><circle cx="60" cy="34" r="2.6" fill="#f2a58e" opacity=".6"/>';
  // lue / caps
  if (hat === 'cap') g += '<path d="M34 22 Q34 8 50 8 Q66 8 66 22 Z" fill="#2fb8ff"/><rect x="50" y="19" width="26" height="5" rx="2.5" fill="#1b8fd1"/>';
  else if (hat) g += '<path d="M33 22 Q33 4 50 4 Q67 4 67 22 Z" fill="' + hat + '"/><rect x="32" y="18" width="36" height="8" rx="4" fill="rgba(255,255,255,.35)"/><circle cx="50" cy="3.5" r="5" fill="#f4f6f8"/>';
  // nedbør og vind rundt barnet
  var i, dx = [8, 90, 14, 86, 5, 94];
  if (wet && !a.snow) for (i = 0; i < 6; i++) g += '<path d="M' + dx[i] + ' ' + (14 + i * 20) + ' l-3 8" stroke="#5aaeff" stroke-width="2" stroke-linecap="round"/>';
  if (wet && a.snow) for (i = 0; i < 6; i++) g += '<circle cx="' + dx[i] + '" cy="' + (16 + i * 20) + '" r="2.6" fill="#e8f2ff"/>';
  if (a.wind >= 10) g += '<path d="M2 50 h12 M0 60 h16 M3 70 h10" stroke="#9bb0c5" stroke-width="2" stroke-linecap="round" opacity=".7"/>';
  return '<svg viewBox="0 0 100 146" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}
function renderWeather() {
  if (!weatherData) {
    $('hours').innerHTML = '<div class="none">' + (fails.weather >= 3 ? 'Ingen værdata akkurat nå' : 'Laster …') + '</div>';
    if (fails.weather >= 3) { $('advice').className = 'advice'; $('advice').innerHTML = '<div class="a1">Sjekk været ute</div><div class="a2">Får ikke kontakt med værtjenesten</div>'; }
    return;
  }
  var now = new Date(), ts = weatherData.filter(function (x) { return new Date(x.time).getTime() > now.getTime() - 3600e3; });
  if (!ts.length) return;
  var cur = ts[0], d = cur.data.instant.details;
  var code = (cur.data.next_1_hours || cur.data.next_6_hours || {}).summary;
  code = code ? code.symbol_code : '';
  $('nowIcon').innerHTML = iconSvg(code);
  $('nowTemp').textContent = Math.round(d.air_temperature);
  $('nowMeta').innerHTML = '<b>' + label(code) + '</b>Vind ' + Math.round(d.wind_speed) + ' m/s<br>Fuktighet ' + Math.round(d.relative_humidity) + ' %';

  // Resten av dagen: til midnatt, men minst 8 timer fremover
  var midnight = new Date(now); midnight.setHours(24, 0, 0, 0);
  var list = ts.filter(function (x) { return x.data.next_1_hours; });
  var until = list.filter(function (x) { return new Date(x.time) < midnight; });
  if (until.length < 8) until = list.slice(0, 8);
  until = until.slice(0, CFG.hoursShown);

  var adv = makeAdvice(ts, until, now, d, code);
  $('kid').innerHTML = kidSvg(adv);
  var el = $('advice');
  el.className = 'advice ' + adv.kind;
  el.innerHTML = '<div class="a1">' + adv.a1 + '</div><div class="a2">' + adv.a2 + '</div>';

  var html = '';
  until.forEach(function (x, idx) {
    var dt = new Date(x.time), n1 = x.data.next_1_hours, p = n1.details.precipitation_amount || 0;
    var wd = x.data.instant.details, ws = wd.wind_speed || 0, dir = (wd.wind_from_direction || 0) + 180;
    var rv = p < 0.1 ? '0' : (p < 10 ? p.toFixed(1).replace('.', ',') : '' + Math.round(p));
    var wcls = ws >= 14 ? ' stormy' : (ws >= 8 ? ' breezy' : '');
    html += '<div class="hour' + (p >= 0.2 ? ' wet' : '') + '"><div class="h">' + (idx === 0 ? 'nå' : pad(dt.getHours())) + '</div><div class="i">' + iconSvg(n1.summary.symbol_code) +
      '</div><div class="t">' + Math.round(wd.air_temperature) + '°</div>' +
      '<div class="blk rain' + (p < 0.1 ? ' zero' : (p >= 0.2 ? ' wetb' : '')) + '"><div class="v">' + rv + '</div><div class="u">mm</div></div>' +
      '<div class="blk wind' + wcls + '"><svg viewBox="0 0 24 24" style="-webkit-transform:rotate(' + Math.round(dir) + 'deg);transform:rotate(' + Math.round(dir) + 'deg)"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="currentColor"/></svg>' +
      '<div class="v">' + Math.round(ws) + '</div><div class="u">m/s</div></div></div>';
  });
  $('hours').innerHTML = html;
}

// ===== Avganger (Entur) =====
var departures = {};
function loadTransit() {
  var stops = {};
  CFG.boards.forEach(function (b) { stops[b.stop] = 1; });
  var ids = Object.keys(stops), q = '{', i;
  for (i = 0; i < ids.length; i++) {
    q += 's' + i + ':stopPlace(id:"' + ids[i] + '"){estimatedCalls(numberOfDepartures:80,timeRange:10800){realtime cancellation ' +
      'expectedDepartureTime destinationDisplay{frontText} quay{id} serviceJourney{line{publicCode}}}}';
  }
  q += '}';
  fetch('https://api.entur.io/journey-planner/v3/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'ET-Client-Name': CFG.clientName },
    body: JSON.stringify({ query: q })
  })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      var byStop = {};
      ids.forEach(function (id, k) { byStop[id] = (j.data['s' + k] || {}).estimatedCalls || []; });
      CFG.boards.forEach(function (b) {
        // Innstilte avganger beholdes (vises overstreket) så man ikke venter på dem
        departures[b.el] = byStop[b.stop].filter(function (c) {
          return c.quay.id === b.quay && (!b.line || c.serviceJourney.line.publicCode === b.line);
        }).slice(0, b.n + 2);
      });
      fails.transit = 0; lastOk.transit = Date.now(); renderTimes(); updateStale();
    })
    .catch(function () { fails.transit++; updateStale(); renderTimes(); });
}
function rowHtml(c, b, now, state) {
  var t = new Date(c.expectedDepartureTime), secs = (t.getTime() - now) / 1000, mins = Math.floor(secs / 60);
  var when = c.cancellation ? hhmm(t) : (mins < 1 ? 'nå' : (mins < 20 ? mins + ' min' : hhmm(t)));
  var det = (mins < 20 && !c.cancellation ? 'kl. ' + hhmm(t) : '') + (c.realtime && !c.cancellation ? ' <span class="rt">●</span>' : '');
  var go = '', cls = 'row';
  if (c.cancellation) { cls += ' cancel'; go = 'Innstilt'; }
  else if (state.kind === 'missed') { cls += ' missed'; go = 'Rekker ikke'; }
  else if (state.kind === 'target') {
    var slack = secs - b.walk * 60;
    cls += ' target';
    if (b.walk > 0) {
      if (slack <= 60) { cls += ' gonow'; go = 'Gå nå!'; }
      else go = 'Gå om ' + Math.floor(slack / 60) + ' min';
    }
  }
  if (state.kind === 'target' && go && det) { go += '<small>' + det + '</small>'; det = ''; }
  return '<div class="' + cls + '"><div class="when">' + when + '</div><div class="det">' + det + '</div><div class="go">' + go + '</div></div>';
}
function renderTimes() {
  var now = Date.now(), old = lastOk.transit && now - lastOk.transit > CFG.staleAfterMin * 60e3;
  CFG.boards.forEach(function (b) {
    var box = $(b.el), rows = box.querySelector('.rows');
    box.querySelector('.walk').textContent = b.walk > 0 ? 'gå ' + b.walk + ' min' : '';
    box.className = 'board' + (old ? ' old' : '');
    var empty = function (msg) { return '<div class="row empty"><div class="det">' + msg + '</div></div>'; };
    if (!departures[b.el]) { rows.innerHTML = empty(fails.transit >= 3 ? 'Ingen avgangsdata akkurat nå' : 'Laster …'); return; }
    var list = departures[b.el].filter(function (c) { return new Date(c.expectedDepartureTime).getTime() > now - 20e3; });
    if (!list.length) { rows.innerHTML = empty('Ingen avganger de neste timene'); return; }
    // Hold rede på hva som rekkes: gåtid + 1 min margin
    var need = b.walk * 60 - 60, out = [], lastMissed = null, targetFound = false, i, c, secs, st;
    for (i = 0; i < list.length; i++) {
      c = list[i]; secs = (new Date(c.expectedDepartureTime).getTime() - now) / 1000;
      if (c.cancellation) { st = { kind: 'cancel' }; }
      else if (secs < need) { st = { kind: 'missed' }; lastMissed = out.length; }
      else if (!targetFound) { st = { kind: 'target' }; targetFound = true; }
      else st = { kind: 'next' };
      out.push({ c: c, st: st });
    }
    // Vis maks én rad man ikke rekker (som kontekst), deretter de man rekker
    var show = [], skipTo = 0, j;
    for (j = 0; j < out.length; j++) if (out[j].st.kind === 'missed') skipTo = j;
    for (j = skipTo; j < out.length && show.length < CFG.rows; j++) show.push(out[j]);
    var html = show.map(function (o) { return rowHtml(o.c, b, now, o.st); }).join('');
    for (j = show.length; j < CFG.rows; j++) html += '<div class="row empty"></div>';
    rows.innerHTML = html;
  });
}
function updateStale() {
  var m = [], now = Date.now();
  if (fails.weather >= 3 && weatherData) m.push('vær');
  if (fails.transit >= 3 || (lastOk.transit && now - lastOk.transit > CFG.staleAfterMin * 60e3)) m.push('avganger');
  $('stale').textContent = m.length ? '⚠ Utdatert: ' + m.join(' og ') : '';
}

// ===== Demodata (?demo=...) =====
function demoWeather(kind) {
  var now = new Date(), ts = [], i, t, codes, temp = { rain: 9, fog: 6, snow: -3, clear: 19, night: 4, cancel: 11, thunder: 17 }[kind];
  if (temp === undefined) temp = 9;
  var tm = /[?&]temp=(-?\d+)/.exec(location.search); if (tm) temp = parseInt(tm[1], 10);
  for (i = 0; i < 30; i++) {
    t = new Date(now.getTime() + (i - 0) * 3600e3); t.setMinutes(0, 0, 0);
    var sym = 'partlycloudy_day', pr = 0, h = t.getHours();
    if (kind === 'rain' || kind === 'cancel') { sym = i < 3 ? 'cloudy' : (i < 6 ? 'lightrain' : (i < 9 ? 'rain' : (i === 9 ? 'heavyrain' : 'cloudy'))); pr = i < 3 ? 0 : (i < 6 ? .6 : (i < 9 ? 1.6 : (i === 9 ? 3.4 : 0.1))); }
    else if (kind === 'fog') { sym = 'fog'; }
    else if (kind === 'snow') { sym = i < 3 ? 'lightsnow' : 'snow'; pr = i < 3 ? .5 : 2; }
    else if (kind === 'thunder') { sym = i < 4 ? 'cloudy' : 'rainandthunder'; pr = i < 4 ? 0 : 2.6; }
    else if (kind === 'night') { sym = 'clearsky_night'; }
    else { sym = i < 4 ? 'clearsky_day' : (i < 8 ? 'fair_day' : 'partlycloudy_day'); }
    if (h >= 22 || h < 6) sym = sym.replace('_day', '_night');
    ts.push({ time: t.toISOString(), data: {
      instant: { details: { air_temperature: temp + Math.round(Math.sin(i / 3) * 2), wind_speed: kind === 'thunder' ? 11 : 3.4, relative_humidity: 78 } },
      next_1_hours: { summary: { symbol_code: sym }, details: { precipitation_amount: pr } } } });
  }
  return ts;
}
function demoTransit(kind) {
  var now = Date.now(), plan = { 'b-hauger': [3.5, 9, 14, 21, 29, 36] };
  var dest = { 'b-hauger': 'Frognerseteren' };
  CFG.boards.forEach(function (b) {
    departures[b.el] = plan[b.el].map(function (m, i) {
      return { realtime: i !== 3, cancellation: kind === 'cancel' && i === 2,
        expectedDepartureTime: new Date(now + m * 60e3).toISOString(), destinationDisplay: { frontText: dest[b.el] },
        quay: { id: b.quay }, serviceJourney: { line: { publicCode: b.line || '3' } } };
    });
  });
  lastOk.transit = now; fails.transit = 0;
}

tick(); setInterval(tick, 10000);
if (DEMO) {
  if (DEMO === 'error') { fails.weather = 3; fails.transit = 3; renderWeather(); renderTimes(); updateStale(); }
  else { weatherData = demoWeather(DEMO); lastOk.weather = Date.now(); renderWeather(); demoTransit(DEMO); renderTimes();
    setInterval(function () { demoTransit(DEMO); }, 60e3); }
} else {
  loadWeather(); setInterval(loadWeather, 10 * 60e3);
  loadTransit(); setInterval(loadTransit, 30e3);
  // Full omlasting hver natt, så en evig kjørende side holder seg frisk
  setInterval(function () { var d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0) location.reload(); }, 60e3);
}
