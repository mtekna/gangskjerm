<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gangskjerm</title>
<style>
  :root {
    --bg: #0b121a; --card: #152130; --card2: #1b2a3c; --line: #27384c;
    --text: #f4f8fb; --muted: #9bb0c5; --faint: #4d6277;
    --accent: #ffd166; --good: #5fe39a; --warn: #ff8a7a; --rain: #5aaeff;
    --metro: #ff7a3d; --bus: #4fa3ff; --ink: #0b121a;
  }
  body.dim {
    --bg: #05080c; --card: #0b1118; --card2: #0f1620; --line: #16202b;
    --text: #94a4b4; --muted: #576779; --faint: #2c3947;
    --accent: #b99555; --good: #5aa57c; --warn: #b5675d; --rain: #43739f;
    --metro: #a2542c; --bus: #34678f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor: none;
    font-variant-numeric: tabular-nums; }
  body.dim svg { opacity: .6; }
  .screen { display: flex; flex-direction: column; height: 100vh; padding: 2.2vh 2vw; }
  .upper { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .lower { display: flex; flex: none; height: 33vh; margin-top: 1.6vh; }
  .transit { flex: none; width: 44vw; display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; margin-left: 1.6vw; }

  /* ---------- Topp: vær | barn | klokke ---------- */
  .head { display: flex; flex: none; height: 42vh; }
  .hl { -webkit-box-flex: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mini { display: flex; align-items: center; height: 4vh; color: var(--muted); font-size: 2.6vh; white-space: nowrap; }
  .mini .place { flex: none; margin-right: 1.6vw; }
  .mini .warn { color: var(--warn); font-size: 2.4vh; overflow: hidden; text-overflow: ellipsis; }
  .now { display: flex; align-items: center; -webkit-box-flex: 1; flex: 1; min-height: 0; }
  .now .icon { width: 19vh; height: 19vh; margin-right: 1vw; flex: none; }
  .now .icon svg { width: 100%; height: 100%; display: block; }
  .now .temp { font-size: 22vh; font-weight: 700; line-height: 1; white-space: nowrap; letter-spacing: -.02em; }
  .now .temp small { font-size: 8vh; color: var(--muted); font-weight: 400; vertical-align: top; position: relative; top: 1.2vh; }
  .now .meta { margin-left: 1.4vw; font-size: 3.2vh; color: var(--muted); line-height: 1.45; min-width: 0; }
  .now .meta b { display: block; color: var(--text); font-weight: 600; font-size: 4vh; }
  .kid { flex: none; width: 28.8vh; height: 100%; margin: 0 1.2vw; }
  .kid svg { width: 100%; height: 100%; display: block; }
  .hr { flex: none; display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .clock { text-align: right; font-size: 11.5vh; line-height: 1; color: var(--text); font-weight: 700; letter-spacing: -.01em; }
  .flagday { display: flex; align-items: center; margin-top: 2vh; max-width: 36vh; }
  .flagday svg { width: 10vh; height: 7.3vh; display: block; margin-right: .9vw; flex: none; }
  .flagday b { display: block; color: var(--text); font-size: 3.6vh; font-weight: 700; line-height: 1.1; }
  .flagday span { display: block; color: var(--muted); font-size: 2.4vh; line-height: 1.25; }

  /* ---------- Handling ---------- */
  .advice { margin: 1.4vh 0 0; padding: 1.6vh 1.6vw; border-radius: 1.6vh; background: var(--card); -webkit-box-flex: 1; flex: 1; min-height: 0;
    border-left: 1vh solid var(--faint); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .advice.rain { border-left-color: var(--rain); }
  .advice.cold { border-left-color: #9ad0ff; }
  .advice.ok { border-left-color: var(--good); }
  .advice .a1 { font-size: 6vh; font-weight: 700; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a2 { font-size: 3.8vh; color: var(--muted); margin-top: .8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a1 .ic { display: inline-block; width: 6.6vh; height: 6.6vh; vertical-align: -1.2vh; margin-right: .8vw; }

  /* ---------- Timestripe ---------- */
  .hours { -webkit-box-flex: 1; flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-gap: .6vw; min-height: 0; }
  .hour { background: var(--card); border-radius: 1.2vh; display: flex; flex-direction: column;
    align-items: center; padding: 1vh .1vw 1vh; min-width: 0; }
  .hour.wet { background: var(--card2); }
  .hour .h { font-size: 2.6vh; color: var(--muted); height: 3.2vh; }
  .hour .i { width: 5.6vh; height: 5.6vh; margin: .4vh 0; }
  .hour .i svg { width: 100%; height: 100%; display: block; }
  .hour .t { font-size: 3.4vh; font-weight: 700; height: 4.2vh; }
  .hour .blk { -webkit-box-flex: 1; flex: 1; width: 88%; margin-top: .8vh; border-radius: .9vh; background: rgba(120,150,180,.10);
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  .hour .blk .v { font-size: 3.3vh; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .hour .blk .u { font-size: 2vh; color: var(--muted); line-height: 1.2; white-space: nowrap; }
  .hour .blk svg { width: 3.6vh; height: 3.6vh; display: block; margin-bottom: .3vh; }
  .hour .rain .v { color: var(--rain); }
  .hour .rain.zero { background: transparent; }
  .hour .rain.zero .v, .hour .rain.zero .u { color: var(--faint); font-weight: 500; }
  .hour .rain.wetb { background: rgba(79,163,255,.18); }
  .hour .wind .v { color: var(--text); }
  .hour .wind.breezy .v, .hour .wind.breezy svg { color: var(--accent); }
  .hour .wind.stormy .v, .hour .wind.stormy svg { color: var(--warn); }
  .hour .wind svg { color: var(--muted); }
  .hours .none { grid-column: 1 / -1; color: var(--muted); font-size: 3vh; padding: 3vh 1vw; background: var(--card); border-radius: 1.2vh; }

  /* ---------- Avganger ---------- */
  .board { background: var(--card); border-radius: 1.6vh; padding: 1.2vh 1.4vw 1vh; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .board h2 { display: flex; align-items: center; font-size: 3.2vh; font-weight: 700; height: 4.6vh; flex: none; }
  .badge { display: inline-block; min-width: 5vh; text-align: center; padding: .3vh 1vh; border-radius: .9vh; color: var(--ink); font-weight: 800; font-size: 3vh; margin-right: .9vw; }
  body.dim .badge { color: #05080c; }
  .badge.metro { background: var(--metro); } .badge.bus { background: var(--bus); }
  .board h2 .sub { color: var(--muted); font-weight: 400; font-size: 2.4vh; margin-left: .8vw; white-space: nowrap; }
  .board h2 .walk { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 2.4vh; white-space: nowrap; }
  .rows { -webkit-box-flex: 1; flex: 1; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); grid-gap: .5vh; margin-top: 1vh; min-height: 0; }
  .row { display: flex; align-items: center; padding: 0 .9vw; border-radius: 1vh; border-left: .8vh solid transparent; min-height: 0; overflow: hidden; }
  .row .when { width: 20vh; font-size: 4.6vh; font-weight: 700; white-space: nowrap; line-height: 1; }
  .row .det { -webkit-box-flex: 1; flex: 1; min-width: 0; font-size: 2.5vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .row .det .rt { color: var(--good); }
  .row .go { font-size: 3.2vh; font-weight: 800; white-space: nowrap; text-align: right; margin-left: 1vw; }
  .row.target { background: rgba(95,227,154,.14); border-left-color: var(--good); }
  .row.target .when { font-size: 5.6vh; color: var(--good); }
  .row.target .det { color: var(--text); }
  .row.target.gonow { background: rgba(255,209,102,.18); border-left-color: var(--accent); }
  .row.target.gonow .when, .row.target.gonow .go { color: var(--accent); }
  .row.target .go { color: var(--good); }
  .row .go small { display: block; font-size: 2.3vh; font-weight: 400; color: var(--muted); line-height: 1.3; }
  .row.missed { opacity: .38; }
  .row.missed .go { font-weight: 500; font-size: 2.3vh; }
  .row.cancel .when { text-decoration: line-through; color: var(--warn); }
  .row.cancel .go { color: var(--warn); font-size: 2.6vh; }
  .row.cancel { opacity: .85; }
  .row.empty .det { font-size: 2.8vh; }
  .board.old .rows { opacity: .35; }

  /* ---------- Sider (sveip) ---------- */
  .pager { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; -ms-touch-action: none; touch-action: none; }
  .track { display: flex; width: 200vw; height: 100vh; -webkit-transition: -webkit-transform .35s ease; transition: transform .35s ease; will-change: transform; }
  .track.drag { -webkit-transition: none; transition: none; }
  .page { flex: none; width: 100vw; height: 100vh; position: relative; }
  .dots { position: fixed; left: 0; right: 0; bottom: .5vh; display: flex; justify-content: center; z-index: 5; pointer-events: none; }
  .dots i { display: block; width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--faint); margin: 0 .7vh; -webkit-transition: background .3s, -webkit-transform .3s; transition: background .3s, transform .3s; }
  .dots i.on { background: var(--text); -webkit-transform: scale(1.35); transform: scale(1.35); }

  /* ---------- Morgenrutine ---------- */
  .routine { height: 100%; padding: 2.2vh 2vw 3vh; display: flex; flex-direction: column; }
  .rtop { display: flex; justify-content: space-between; align-items: center; height: 8vh; flex: none; }
  .rtop .ttl { font-size: 4.4vh; font-weight: 700; }
  .rtop .ttl span { color: var(--muted); font-weight: 400; font-size: 3vh; margin-left: 1.2vw; }
  .rtop .rclock { font-size: 7vh; font-weight: 700; line-height: 1; }
  .cols { -webkit-box-flex: 1; flex: 1; display: flex; min-height: 0; margin-top: 1vh; }
  .col { -webkit-box-flex: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border-radius: 1.8vh; padding: 1.4vh 1.2vw; border-top: 1vh solid var(--faint); margin-right: 1.4vw; }
  .col:last-child { margin-right: 0; }
  .col h3 { display: flex; align-items: center; height: 11vh; flex: none; font-size: 5vh; font-weight: 700; }
  .col h3 svg { width: 9.6vh; height: 9.6vh; flex: none; margin-right: 1vw; display: block; }
  .col h3 .ok { margin-left: auto; font-size: 3vh; color: var(--good); font-weight: 700; opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s; white-space: nowrap; }
  .col.done h3 .ok { opacity: 1; }
  .col.done { border-top-color: var(--good) !important; }
  .tasks { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .task { -webkit-box-flex: 1; flex: 1; display: flex; align-items: center; min-height: 0; border-top: 1px solid var(--line); padding: 0 .4vw; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .task:first-child { border-top: 0; }
  .task .circle { flex: none; width: 8.4vh; height: 8.4vh; border-radius: 50%; border: .9vh solid var(--faint); margin-right: .9vw; display: flex; align-items: center; justify-content: center; -webkit-transition: background .2s, border-color .2s; transition: background .2s, border-color .2s; }
  .task .circle svg { width: 70%; height: 70%; opacity: 0; -webkit-transform: scale(.4); transform: scale(.4); -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s; }
  .task .pic { flex: none; width: 9.6vh; height: 9.6vh; margin-right: .9vw; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .task .pic svg { width: 100%; height: 100%; display: block; }
  .task .txt { -webkit-box-flex: 1; flex: 1; min-width: 0; font-size: 3.5vh; font-weight: 600; line-height: 1.12; -webkit-transition: color .2s; transition: color .2s; }
  .task .txt small { display: block; margin-top: .4vh; font-size: 2.2vh; font-weight: 400; color: var(--muted); line-height: 1.2; }
  .task.on .circle { background: var(--good); border-color: var(--good); }
  .task.on .circle svg { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }
  .task.on .pic { opacity: .4; }
  .task.on .txt { color: var(--muted); text-decoration: line-through; }
  .task.on .txt small { text-decoration: none; }
</style>
</head>
<body>
<div class="pager" id="pager"><div class="track" id="track">
<div class="page">
<div class="screen">
  <section class="upper">
    <div class="head">
      <div class="hl">
        <div class="mini"><div class="place" id="place">Hjemme</div><div class="warn" id="stale"></div></div>
        <div class="now">
          <div class="icon" id="nowIcon"></div>
          <div class="temp"><span id="nowTemp">--</span><small>°</small></div>
          <div class="meta" id="nowMeta"></div>
        </div>
      </div>
      <div class="kid" id="kid"></div>
      <div class="hr"><div class="clock" id="clock">--:--</div><div class="flagday" id="flagday"></div></div>
    </div>
    <div class="advice" id="advice"><div class="a1">Henter vær …</div><div class="a2"></div></div>
  </section>

  <section class="lower">
    <div class="hours" id="hours"></div>
    <div class="transit">
      <div class="board" id="b-hauger"><h2><span class="badge metro">3</span>Hauger<span class="sub">mot sentrum</span><span class="walk"></span></h2><div class="rows"></div></div>
    </div>
  </section>
</div>
</div>

<div class="page">
  <div class="routine">
    <div class="rtop"><div class="ttl">Morgenrutine<span id="rdate"></span></div><div class="rclock" id="rclock">--:--</div></div>
    <div class="cols" id="cols"></div>
  </div>
</div>
</div></div>
<div class="dots" id="dots"><i class="on"></i><i></i></div>

<script>
// ===== Konfigurasjon =====
// walk = gåtid i minutter fra døra til holdeplassen. Avganger du ikke rekker dempes,
// og første du rekker fremheves med "Gå om N min". Sett walk: 0 for å skru av.
var CFG = {
  lat: 59.92, lon: 10.51,                     // Bærum (avrundet)
  clientName: 'privat-gangskjerm',            // Entur ber om et navn på klienten
  boards: [
    { el: 'b-hauger',   stop: 'NSR:StopPlace:58283', quay: 'NSR:Quay:7305', n: 4, walk: 8 }                     // Hauger, T3 mot Oslo
  ],
  rows: 3,                                    // antall avgangsrader (må matche grid i .rows)
  hoursShown: 10,                             // maks antall timer i timestripen
  dimFrom: 22, dimTo: 6,                      // dimmet visning om natten
  staleAfterMin: 4                            // avganger eldre enn dette markeres som utdatert
};

// Demo: ?demo=1 (regn), ?demo=fog | snow | clear | night | cancel | error | thunder, valgfritt &temp=-5 for å overstyre temperatur
var DEMO = (function () { var m = /[?&]demo=([^&]*)/.exec(location.search); return m ? (m[1] === '1' ? 'rain' : m[1]) : ''; })();

function $(id) { return document.getElementById(id); }
// ===== Norsk tid, uavhengig av tidssonen på nettbrettet =====
var OSLO_FMT = null;
try { OSLO_FMT = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Oslo', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }); } catch (e) { OSLO_FMT = null; }
// Gir en Date der getHours() osv. returnerer klokkeslettet i Norge
function osl(d) {
  if (!OSLO_FMT || !OSLO_FMT.formatToParts) return d;
  var parts = OSLO_FMT.formatToParts(d), v = {}, i;
  for (i = 0; i < parts.length; i++) v[parts[i].type] = parseInt(parts[i].value, 10);
  return new Date(v.year, v.month - 1, v.day, v.hour % 24, v.minute, v.second);
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hhmm(d) { var o = osl(d); return pad(o.getHours()) + ':' + pad(o.getMinutes()); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var fails = { weather: 0, transit: 0 };
var lastOk = { weather: 0, transit: 0 };

// ===== Klokke + dimming =====
// ===== Flaggdager (offisielle, jf. forskrift om flagging) =====
var FLAGTEST = (function () { var m = /[?&]flag=(\d{4}-\d{2}-\d{2})/.exec(location.search); return m ? m[1] : ''; })();
var FIXED_FLAG = { '1-1': 'Nyttårsdag', '1-21': 'Prinsesse Ingrid Alexandras fødselsdag', '2-6': 'Samefolkets dag',
  '2-21': 'Kong Haralds fødselsdag', '5-1': 'Offentlig høytidsdag', '5-8': 'Frigjøringsdagen', '5-17': 'Grunnlovsdagen',
  '6-7': 'Unionsoppløsningen 1905', '7-4': 'Dronning Sonjas fødselsdag', '7-20': 'Kronprins Haakons fødselsdag',
  '7-29': 'Olsok', '8-19': 'Kronprinsesse Mette-Marits fødselsdag', '12-25': '1. juledag' };
function easterSunday(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function flagDayName(d) {
  var y = d.getFullYear(), n = FIXED_FLAG[(d.getMonth() + 1) + '-' + d.getDate()];
  if (n) return n;
  var e = easterSunday(y);
  if (sameDay(d, e)) return '1. påskedag';
  if (sameDay(d, new Date(y, e.getMonth(), e.getDate() + 49))) return '1. pinsedag';
  // Stortingsvalg: andre mandag i september, hvert fjerde år (2025, 2029, ...)
  if (y >= 2025 && (y - 2025) % 4 === 0 && d.getMonth() === 8) {
    var first = 1 + ((8 - new Date(y, 8, 1).getDay()) % 7);
    if (d.getDate() === first + 7) return 'Stortingsvalget';
  }
  return '';
}
var flagShown = null;
function renderFlag(d) {
  var test = FLAGTEST ? new Date(FLAGTEST + 'T12:00:00') : d, name = flagDayName(test);
  if (name === flagShown) return;
  flagShown = name;
  var mo = test.getMonth(), hoist = (mo >= 2 && mo <= 9) ? '08' : '09';
  $('flagday').innerHTML = name ? '<svg viewBox="0 0 22 16"><rect width="22" height="16" rx="1" fill="#ba0c2f"/><rect x="6" width="4" height="16" fill="#fff"/><rect y="6" width="22" height="4" fill="#fff"/><rect x="7" width="2" height="16" fill="#00205b"/><rect y="7" width="22" height="2" fill="#00205b"/></svg>' +
    '<div><b>Flaggdag</b><span>' + name + ' · heis kl. ' + hoist + '</span></div>' : '';
}

function tick() {
  var real = new Date(), d = osl(real);
  $('clock').textContent = hhmm(real);
  $('rclock').textContent = hhmm(real);
  checkReset();
  renderFlag(d);
  var h = d.getHours();
  var dim = DEMO === 'night' || (h >= CFG.dimFrom || h < CFG.dimTo);
  document.body.className = dim ? 'dim' : '';
  renderTimes(); updateStale();
}

// ===== Værikoner (inline SVG, ser lik ut på alle enheter) =====
function sunSvg(cx, cy, r) {
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffd166"/>', i, a, x1, y1, x2, y2;
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4; x1 = cx + Math.cos(a) * (r + 4); y1 = cy + Math.sin(a) * (r + 4);
    x2 = cx + Math.cos(a) * (r + 9); y2 = cy + Math.sin(a) * (r + 9);
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#ffd166" stroke-width="3.2" stroke-linecap="round"/>';
  }
  return s;
}
function moonSvg(cx, cy) {
  return '<path transform="translate(' + (cx - 20) + ' ' + (cy - 20) + ')" d="M24 3a17 17 0 1 0 13 28 14 14 0 0 1-13-28z" fill="#e6e0b8"/>';
}
function cloudSvg(x, y, s, fill) {
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path d="M14 40a9 9 0 0 1 1-18 12 12 0 0 1 23-2 10 10 0 0 1 2 20z" fill="' + fill + '"/></g>';
}
function dropsSvg(n, color) {
  var xs = n === 1 ? [30] : (n === 2 ? [24, 36] : [20, 31, 42]), s = '', i;
  for (i = 0; i < xs.length; i++) s += '<line x1="' + (xs[i] + 2) + '" y1="49" x2="' + (xs[i] - 2) + '" y2="58" stroke="' + color + '" stroke-width="3.6" stroke-linecap="round"/>';
  return s;
}
function flakesSvg(n) {
  var xs = n === 1 ? [32] : (n === 2 ? [25, 39] : [20, 32, 44]), s = '', i;
  for (i = 0; i < xs.length; i++) s += '<circle cx="' + xs[i] + '" cy="' + (i % 2 ? 57 : 52) + '" r="3" fill="#e8f2ff"/>';
  return s;
}
function parseCode(code) {

        quay: { id: b.quay }, serviceJourney: { line: { publicCode: b.line || '3' } } };
    });
  });
  lastOk.transit = now; fails.transit = 0;
}

// ===== Sider: sveip mellom visninger =====
CFG.autoReturnMin = 5;   // gå tilbake til side 1 etter så mange minutter uten berøring (0 = av)
var page = 0, lastAct = Date.now();
function go(n, instant) {
  page = n;
  var tr = $('track');
  tr.className = 'track' + (instant ? ' drag' : '');
  tr.style.webkitTransform = tr.style.transform = 'translate3d(' + (-n * 100) + 'vw,0,0)';
  var d = $('dots').children, i;
  for (i = 0; i < d.length; i++) d[i].className = i === n ? 'on' : '';
}
(function () {
  var pg = $('pager'), tr = $('track'), sx = 0, sy = 0, dx = 0, mode = '', down = false, t0 = 0;
  function pos(e) { var t = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e); return { x: t.clientX, y: t.clientY }; }
  function start(e) { var p = pos(e); sx = p.x; sy = p.y; dx = 0; mode = ''; down = true; t0 = Date.now(); lastAct = t0; }
  function move(e) {
    if (!down) return;
    var p = pos(e), mx = p.x - sx, my = p.y - sy;
    if (!mode && (Math.abs(mx) > 8 || Math.abs(my) > 8)) mode = Math.abs(mx) > Math.abs(my) ? 'h' : 'v';
    if (mode !== 'h') return;
    if (e.cancelable) e.preventDefault();
    dx = mx;
    if ((page === 0 && dx > 0) || (page === 1 && dx < 0)) dx = dx / 4;       // motstand i endene
    tr.className = 'track drag';
    tr.style.webkitTransform = tr.style.transform = 'translate3d(' + (-page * window.innerWidth + dx) + 'px,0,0)';
  }
  function end() {
    if (!down) return; down = false;
    if (mode === 'h') {
      window.__swiped = Date.now();
      var fast = Math.abs(dx) > 40 && Date.now() - t0 < 300;
      if (dx < -window.innerWidth * 0.15 || (fast && dx < 0)) go(1);
      else if (dx > window.innerWidth * 0.15 || (fast && dx > 0)) go(0);
      else go(page);
    }
    mode = '';
  }
  pg.addEventListener('touchstart', start, false);
  pg.addEventListener('touchmove', move, false);
  pg.addEventListener('touchend', end, false);
  pg.addEventListener('touchcancel', end, false);
  pg.addEventListener('mousedown', start, false);
  window.addEventListener('mousemove', move, false);
  window.addEventListener('mouseup', end, false);
  document.addEventListener('keydown', function (e) { lastAct = Date.now(); if (e.keyCode === 39) go(1); if (e.keyCode === 37) go(0); }, false);
  $('dots').style.pointerEvents = 'none';
  setInterval(function () {
    if (CFG.autoReturnMin > 0 && page === 1 && Date.now() - lastAct > CFG.autoReturnMin * 60e3) go(0);
  }, 20e3);
})();

var KIDS = [

  { id: 'dress',     text: 'Kle på seg',      icon: 'shirt' },
  { id: 'breakfast', text: 'Spise frokost',   icon: 'bowl' },

  if (o.rib) g += '<path d="M25 11 Q32 18 39 11" stroke="rgba(0,0,0,.28)" stroke-width="3.5" fill="none"/><path d="M8 37 L14 41 M56 37 L50 41" stroke="rgba(0,0,0,.25)" stroke-width="3.5"/>';
  else g += '<path d="M25 11 Q32 17 39 11" stroke="rgba(255,255,255,.35)" stroke-width="3" fill="none"/>';

function beanie(c) { return '<path d="M42 18 Q42 4 53 4 Q64 4 64 18Z" fill="' + c + '"/><rect x="41" y="15" width="24" height="6" rx="3" fill="rgba(255,255,255,.4)"/><circle cx="53" cy="3.5" r="3.4" fill="#f4f6f8"/>'; }

function boot(c) { return '<path d="M44 34 H54 V54 Q54 58 58 58 H64 V63 H44Z" fill="' + c + '"/><rect x="44" y="34" width="10" height="5" fill="rgba(0,0,0,.18)"/>'; }

function outerLevel(a) { var m = a.minT; return m <= 0 ? 'frost' : (m <= 7 ? 'cold' : (m <= 13 ? 'cool' : (m <= 18 ? 'mild' : 'warm'))); }
function outerSvg(a) {

    else g += '<path d="M6 4 l-2 6 M15 2 l-2 6 M24 4 l-2 6" stroke="#5aaeff" stroke-width="2.2" stroke-linecap="round"/>';
  } else if (lvl === 'frost') g = big + jacketPath('#3a6fd8', { zip: true, puffy: true }) + '</g>' + beanie('#e63946') + mitten('#e63946');
  else if (lvl === 'cold') g = big + jacketPath('#f08a24', { zip: true, puffy: true }) + '</g>' + beanie('#1fa39a');
  else if (lvl === 'cool') g = '<g transform="translate(0,2) scale(.95)">' + jacketPath('#4cae6a', { zip: true }) + '</g>';
  else if (lvl === 'mild') g = '<g transform="translate(0,2) scale(.95)">' + jacketPath('#8e6bd1', { rib: true }) + '</g>';
  else g = '<circle cx="22" cy="22" r="10" fill="#ffd166"/><path d="M22 4 v5 M22 35 v5 M4 22 h5 M35 22 h5 M9 9 l3.5 3.5 M31.5 31.5 l3.5 3.5 M35 9 l-3.5 3.5 M9 35 l3.5 -3.5" stroke="#ffd166" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M26 52 Q26 36 42 36 Q58 36 58 52Z" fill="#2fb8ff"/><rect x="42" y="48" width="22" height="6" rx="3" fill="#1b8fd1"/>';

function outerText(a) {

    '<path d="M34 36 H60 L62 62 H51 L47 49 L43 62 H32Z" fill="#3f5a8a"/><path d="M34 36 H60" stroke="#2c4166" stroke-width="3"/>';
  else if (name === 'bowl') g = '<ellipse cx="32" cy="55" rx="22" ry="4" fill="rgba(0,0,0,.2)"/><path d="M6 32 H58 Q57 54 32 54 Q7 54 6 32Z" fill="#f4f6f8"/><path d="M6 32 H58" stroke="#cfd6de" stroke-width="2"/>' +
    '<ellipse cx="32" cy="32" rx="26" ry="6.5" fill="#ffd58a"/><circle cx="20" cy="31" r="2.6" fill="#c98a3b"/><circle cx="30" cy="29" r="2.6" fill="#c98a3b"/><circle cx="41" cy="32" r="2.6" fill="#c98a3b"/><circle cx="48" cy="29.5" r="2.4" fill="#c98a3b"/>' +
    '<path d="M22 20 q-4 -5 0 -10 M32 18 q-4 -5 0 -10 M42 20 q-4 -5 0 -10" stroke="#9bb0c5" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  else if (name === 'teeth') g = '<path d="M6 12 Q6 4 15 4 Q20 6 24 4 Q33 4 33 12 Q33 21 30 29 Q28 34 26 27 Q24 21 20 21 Q16 21 14 27 Q12 34 10 29 Q6 21 6 12Z" fill="#fff" stroke="#cfd6de" stroke-width="1.5"/>' +
    '<path d="M44 6 l2.2 5.4 5.4 2.2 -5.4 2.2 -2.2 5.4 -2.2 -5.4 -5.4 -2.2 5.4 -2.2z" fill="#ffd166"/>' +
    '<g transform="rotate(-28 34 46)"><rect x="6" y="42" width="38" height="8" rx="4" fill="#4fa3ff"/><rect x="42" y="38" width="16" height="12" rx="3" fill="#e8eef4"/><ellipse cx="50" cy="37" rx="8" ry="3.4" fill="#5fe39a"/><path d="M44 50 v5 M48 50 v5 M52 50 v5 M56 50 v5" stroke="#9bb0c5" stroke-width="1.6"/></g>';
  else if (name === 'bag') g = '<path d="M20 20 Q8 34 12 54" stroke="#c85a14" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M44 20 Q56 34 52 54" stroke="#c85a14" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '<path d="M25 14 Q25 4 32 4 Q39 4 39 14" fill="none" stroke="#c85a14" stroke-width="3.4"/><rect x="14" y="12" width="36" height="46" rx="13" fill="#ff8a3d"/>' +
    '<rect x="20" y="20" width="24" height="10" rx="5" fill="#f26a14"/><circle cx="32" cy="25" r="2.4" fill="#ffd166"/><rect x="20" y="36" width="24" height="16" rx="6" fill="#f26a14"/><path d="M20 37 H44" stroke="#ffe0c2" stroke-width="2"/>';

var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" stroke="#0b121a" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var lastAdvice = { minT: 10, wet: false, snow: false, wind: 0, sunny: false };
var routine = null, RKEY = 'gangskjerm-rutine-v1', mem = null;
var DAYS = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
var MONTHS = ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'];
function todayKey() { var o = osl(new Date()); return o.getFullYear() + '-' + pad(o.getMonth() + 1) + '-' + pad(o.getDate()); }
function loadRoutine() {
  var raw = null;
  try { raw = window.localStorage.getItem(RKEY); } catch (e) { raw = mem; }
  var r = null; try { r = raw ? JSON.parse(raw) : null; } catch (e2) { r = null; }
  routine = (r && r.d === todayKey() && r.c) ? r : { d: todayKey(), c: {} };
}
function saveRoutine() {
  var raw = JSON.stringify(routine); mem = raw;
  try { window.localStorage.setItem(RKEY, raw); } catch (e) { }
}
function buildRoutine() {
  var html = '', i, j;
  for (i = 0; i < KIDS.length; i++) {
    var k = KIDS[i];
    html += '<div class="col" id="col-' + k.id + '" style="border-top-color:' + k.color + '"><h3>' + avatarSvg(k) + k.name + '<span class="ok">⭐ Ferdig!</span></h3><div class="tasks">';
    for (j = 0; j < TASKS.length; j++) {
      var t = TASKS[j];
      html += '<div class="task" data-k="' + k.id + '" data-t="' + t.id + '"><div class="circle">' + CHECK + '</div>' +
        '<div class="pic"' + (t.dyn ? ' data-dyn="1"' : '') + '>' + (t.dyn ? outerSvg(lastAdvice) : iconSvg2(t.icon)) + '</div>' +
        '<div class="txt">' + t.text + (t.dyn ? '<small data-dyn="1">' + outerText(lastAdvice) + '</small>' : '') + '</div></div>';
    }
    html += '</div></div>';
  }
  $('cols').innerHTML = html;
  var els = $('cols').querySelectorAll('.task'), n;
  for (n = 0; n < els.length; n++) els[n].addEventListener('click', onTask, false);
  refreshRoutine();
}
function onTask(e) {
  if (window.__swiped && Date.now() - window.__swiped < 400) return;   // ikke avkrysning etter sveip
  lastAct = Date.now();
  var el = e.currentTarget, key = el.getAttribute('data-k') + '-' + el.getAttribute('data-t');
  if (routine.c[key]) delete routine.c[key]; else routine.c[key] = 1;
  saveRoutine(); refreshRoutine();
}
function refreshRoutine() {
  var els = $('cols').querySelectorAll('.task'), n, k, i;
  for (n = 0; n < els.length; n++) {
    var key = els[n].getAttribute('data-k') + '-' + els[n].getAttribute('data-t');
    els[n].className = 'task' + (routine.c[key] ? ' on' : '');
  }
  for (i = 0; i < KIDS.length; i++) {
    var all = true, j;
    for (j = 0; j < TASKS.length; j++) if (!routine.c[KIDS[i].id + '-' + TASKS[j].id]) all = false;
    $('col-' + KIDS[i].id).className = 'col' + (all ? ' done' : '');
  }
}
function updateOuterwear(a) {
  if (a) lastAdvice = a;
  var pics = document.querySelectorAll('[data-dyn]'), n;
  for (n = 0; n < pics.length; n++) pics[n].innerHTML = pics[n].tagName === 'SMALL' ? outerText(lastAdvice) : outerSvg(lastAdvice);
}
// Nullstill automatisk når datoen (norsk tid) skifter
function checkReset() {
  if (!routine) return;
  var o = osl(new Date());
  $('rdate').textContent = DAYS[o.getDay()] + ' ' + o.getDate() + '. ' + MONTHS[o.getMonth()];
  if (routine.d !== todayKey()) { routine = { d: todayKey(), c: {} }; saveRoutine(); refreshRoutine(); }
}
loadRoutine(); buildRoutine(); checkReset();
if (/[?&]page=2/.test(location.search)) go(1, true);

tick(); setInterval(tick, 10000);
if (DEMO) {
  if (DEMO === 'error') { fails.weather = 3; fails.transit = 3; renderWeather(); renderTimes(); updateStale(); }
  else { weatherData = demoWeather(DEMO); lastOk.weather = Date.now(); renderWeather(); demoTransit(DEMO); renderTimes();
    setInterval(function () { demoTransit(DEMO); }, 60e3); }
} else {
  loadWeather(); setInterval(loadWeather, 10 * 60e3);
  loadTransit(); setInterval(loadTransit, 30e3);
  // Full omlasting hver natt, så en evig kjørende side holder seg frisk
  setInterval(function () { var d = osl(new Date()); if (d.getHours() === 4 && d.getMinutes() === 0) location.reload(); }, 60e3);
}
