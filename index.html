<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gangskjerm</title>
<style>
  :root {
    --bg: #0b121a; --card: #152130; --card2: #1b2a3c; --line: #27384c;
    --text: #f4f8fb; --muted: #9bb0c5; --faint: #4d6277;
    --accent: #ffd166; --good: #5fe39a; --warn: #ff8a7a; --rain: #5aaeff;
    --metro: #ff7a3d; --bus: #4fa3ff; --ink: #0b121a;
  }
  body.dim {
    --bg: #05080c; --card: #0b1118; --card2: #0f1620; --line: #16202b;
    --text: #94a4b4; --muted: #576779; --faint: #2c3947;
    --accent: #b99555; --good: #5aa57c; --warn: #b5675d; --rain: #43739f;
    --metro: #a2542c; --bus: #34678f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Roboto, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor: none;
    font-variant-numeric: tabular-nums; }
  body.dim svg { opacity: .6; }
  .screen { display: flex; flex-direction: column; height: 100vh; padding: 2.2vh 2vw; }
  .upper { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .lower { display: flex; flex: none; height: 33vh; margin-top: 1.6vh; }
  .transit { flex: none; width: 44vw; display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; margin-left: 1.6vw; }

  /* ---------- Topp: vær | barn | klokke ---------- */
  .head { display: flex; flex: none; height: 42vh; }
  .hl { -webkit-box-flex: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mini { display: flex; align-items: center; height: 6.4vh; color: var(--muted); font-size: 2.6vh; white-space: nowrap; }
  .mini .place { flex: none; margin-right: 1.6vw; color: var(--text); font-size: 5vh; font-weight: 700; line-height: 1; }
  .mini .place span { color: var(--muted); font-weight: 400; margin-left: .8vw; }
  .mini .warn { color: var(--warn); font-size: 2.4vh; overflow: hidden; text-overflow: ellipsis; }
  .now { display: flex; align-items: center; -webkit-box-flex: 1; flex: 1; min-height: 0; }
  .now .icon { width: 19vh; height: 19vh; margin-right: 1vw; flex: none; }
  .now .icon svg { width: 100%; height: 100%; display: block; }
  .now .temp { font-size: 22vh; font-weight: 700; line-height: 1; white-space: nowrap; letter-spacing: -.02em; }
  .now .temp small { font-size: 8vh; color: var(--muted); font-weight: 400; vertical-align: top; position: relative; top: 1.2vh; }
  .now .meta { margin-left: 1.4vw; font-size: 3.2vh; color: var(--muted); line-height: 1.45; min-width: 0; }
  .now .meta b { display: block; color: var(--text); font-weight: 600; font-size: 4vh; }
  .kid { flex: none; width: 28.8vh; height: 100%; margin: 0 1.2vw; }
  .kid svg { width: 100%; height: 100%; display: block; }
  .hr { flex: none; display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .clock { text-align: right; font-size: 11.5vh; line-height: 1; color: var(--text); font-weight: 700; letter-spacing: -.01em; }
  .flagday { display: flex; align-items: center; margin-top: 2vh; max-width: 36vh; }
  .flagday svg { width: 10vh; height: 7.3vh; display: block; margin-right: .9vw; flex: none; }
  .flagday b { display: block; color: var(--text); font-size: 3.6vh; font-weight: 700; line-height: 1.1; }
  .flagday span { display: block; color: var(--muted); font-size: 2.4vh; line-height: 1.25; }

  /* ---------- Handling ---------- */
  .advice { margin: 1.4vh 0 0; padding: 1.6vh 1.6vw; border-radius: 1.6vh; background: var(--card); -webkit-box-flex: 1; flex: 1; min-height: 0;
    border-left: 1vh solid var(--faint); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .advice.rain { border-left-color: var(--rain); }
  .advice.cold { border-left-color: #9ad0ff; }
  .advice.ok { border-left-color: var(--good); }
  .advice .a1 { font-size: 6vh; font-weight: 700; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a2 { font-size: 3.8vh; color: var(--muted); margin-top: .8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .advice .a1 .ic { display: inline-block; width: 6.6vh; height: 6.6vh; vertical-align: -1.2vh; margin-right: .8vw; }

  /* ---------- Timestripe ---------- */
  .hours { -webkit-box-flex: 1; flex: 1; display: flex; min-width: 0; min-height: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: none; width: 5.3vw; margin-right: .6vw; background: var(--card); border-radius: 1.2vh; display: flex; flex-direction: column;
    align-items: center; padding: 1vh .1vw 1vh; min-width: 0; }
  .hour:last-child { margin-right: 0; }
  .hour.newday { margin-left: 1vw; }
  .hour .h.day { color: var(--accent); font-weight: 700; }
  .hour.wet { background: var(--card2); }
  .hour .h { font-size: 2.6vh; color: var(--muted); height: 3.2vh; }
  .hour .i { width: 5.6vh; height: 5.6vh; margin: .4vh 0; }
  .hour .i svg { width: 100%; height: 100%; display: block; }
  .hour .t { font-size: 3.4vh; font-weight: 700; height: 4.2vh; }
  .hour .blk { -webkit-box-flex: 1; flex: 1; width: 88%; margin-top: .8vh; border-radius: .9vh; background: rgba(120,150,180,.10);
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  .hour .blk .v { font-size: 3.3vh; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .hour .blk .u { font-size: 2vh; color: var(--muted); line-height: 1.2; white-space: nowrap; }
  .hour .blk svg { width: 3.6vh; height: 3.6vh; display: block; margin-bottom: .3vh; }
  .hour .rain .v { color: var(--rain); }
  .hour .rain.zero { background: transparent; }
  .hour .rain.zero .v, .hour .rain.zero .u { color: var(--faint); font-weight: 500; }
  .hour .rain.wetb { background: rgba(79,163,255,.18); }
  .hour .wind .v { color: var(--text); }
  .hour .wind.breezy .v, .hour .wind.breezy svg { color: var(--accent); }
  .hour .wind.stormy .v, .hour .wind.stormy svg { color: var(--warn); }
  .hour .wind svg { color: var(--muted); }
  .hours .none { flex: 1; color: var(--muted); font-size: 3vh; padding: 3vh 1vw; background: var(--card); border-radius: 1.2vh; }

  /* ---------- Avganger ---------- */
  .board { background: var(--card); border-radius: 1.6vh; padding: 1.2vh 1.4vw 1vh; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .board h2 { display: flex; align-items: center; font-size: 3.2vh; font-weight: 700; height: 4.6vh; flex: none; }
  .badge { display: inline-block; min-width: 5vh; text-align: center; padding: .3vh 1vh; border-radius: .9vh; color: var(--ink); font-weight: 800; font-size: 3vh; margin-right: .9vw; }
  body.dim .badge { color: #05080c; }
  .badge.metro { background: var(--metro); } .badge.bus { background: var(--bus); }
  .board h2 .sub { color: var(--muted); font-weight: 400; font-size: 2.4vh; margin-left: .8vw; white-space: nowrap; }
  .board h2 .walk { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 2.4vh; white-space: nowrap; }
  .rows { -webkit-box-flex: 1; flex: 1; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); grid-gap: .5vh; margin-top: 1vh; min-height: 0; }
  .row { display: flex; align-items: center; padding: 0 .9vw; border-radius: 1vh; border-left: .8vh solid transparent; min-height: 0; overflow: hidden; }
  .row .when { width: 20vh; font-size: 4.6vh; font-weight: 700; white-space: nowrap; line-height: 1; }
  .row .det { -webkit-box-flex: 1; flex: 1; min-width: 0; font-size: 2.5vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .row .det .rt { color: var(--good); }
  .row .go { font-size: 3.2vh; font-weight: 800; white-space: nowrap; text-align: right; margin-left: 1vw; }
  .row.target { background: rgba(95,227,154,.14); border-left-color: var(--good); }
  .row.target .when { font-size: 5.6vh; color: var(--good); }
  .row.target .det { color: var(--text); }
  .row.target.gonow { background: rgba(255,209,102,.18); border-left-color: var(--accent); }
  .row.target.gonow .when, .row.target.gonow .go { color: var(--accent); }
  .row.target .go { color: var(--good); }
  .row .go small { display: block; font-size: 2.3vh; font-weight: 400; color: var(--muted); line-height: 1.3; }
  .row.missed { opacity: .38; }
  .row.missed .go { font-weight: 500; font-size: 2.3vh; }
  .row.cancel .when { text-decoration: line-through; color: var(--warn); }
  .row.cancel .go { color: var(--warn); font-size: 2.6vh; }
  .row.cancel { opacity: .85; }
  .row.empty .det { font-size: 2.8vh; }
  .board.old .rows { opacity: .35; }

  /* ---------- Sider (sveip) ---------- */
  .pager { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; -ms-touch-action: none; touch-action: none; }
  .track { display: flex; width: 200vw; height: 100vh; -webkit-transition: -webkit-transform .35s ease; transition: transform .35s ease; will-change: transform; }
  .track.drag { -webkit-transition: none; transition: none; }
  .page { flex: none; width: 100vw; height: 100vh; position: relative; }
  .dots { position: fixed; left: 0; right: 0; bottom: .5vh; display: flex; justify-content: center; z-index: 5; pointer-events: none; }
  .dots i { display: block; width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--faint); margin: 0 .7vh; -webkit-transition: background .3s, -webkit-transform .3s; transition: background .3s, transform .3s; }
  .dots i.on { background: var(--text); -webkit-transform: scale(1.35); transform: scale(1.35); }

  /* ---------- Morgenrutine ---------- */
  .routine { height: 100%; padding: 2.2vh 2vw 3vh; display: flex; flex-direction: column; }
  .rtop { display: flex; justify-content: space-between; align-items: center; height: 8vh; flex: none; }
  .rtop .ttl { font-size: 4.4vh; font-weight: 700; }
  .rtop .ttl span { color: var(--muted); font-weight: 400; font-size: 3vh; margin-left: 1.2vw; }
  .rtop .rclock { font-size: 7vh; font-weight: 700; line-height: 1; }
  .cols { -webkit-box-flex: 1; flex: 1; display: flex; min-height: 0; margin-top: 1vh; }
  .col { -webkit-box-flex: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border-radius: 1.8vh; padding: 1.4vh 1.2vw; border-top: 1vh solid var(--faint); margin-right: 1.4vw; }
  .col:last-child { margin-right: 0; }
  .col h3 { display: flex; align-items: center; height: 11vh; flex: none; font-size: 5vh; font-weight: 700; }
  .col h3 svg { width: 9.6vh; height: 9.6vh; flex: none; margin-right: 1vw; display: block; }
  .col h3 .ok { margin-left: auto; font-size: 3vh; color: var(--good); font-weight: 700; opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s; white-space: nowrap; }
  .col.done h3 .ok { opacity: 1; }
  .col.done { border-top-color: var(--good) !important; }
  .tasks { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .task { -webkit-box-flex: 1; flex: 1; display: flex; align-items: center; min-height: 0; border-top: 1px solid var(--line); padding: 0 .4vw; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .task:first-child { border-top: 0; }
  .task .circle { flex: none; width: 8.4vh; height: 8.4vh; border-radius: 50%; border: .9vh solid var(--faint); margin-right: .9vw; display: flex; align-items: center; justify-content: center; -webkit-transition: background .2s, border-color .2s; transition: background .2s, border-color .2s; }
  .task .circle svg { width: 70%; height: 70%; opacity: 0; -webkit-transform: scale(.4); transform: scale(.4); -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s; }
  .task .pic { flex: none; width: 9.6vh; height: 9.6vh; margin-right: .9vw; -webkit-transition: opacity .2s; transition: opacity .2s; }
  .task .pic svg { width: 100%; height: 100%; display: block; }
  .task .txt { -webkit-box-flex: 1; flex: 1; min-width: 0; font-size: 3.5vh; font-weight: 600; line-height: 1.12; -webkit-transition: color .2s; transition: color .2s; }
  .task .txt small { display: block; margin-top: .4vh; font-size: 2.2vh; font-weight: 400; color: var(--muted); line-height: 1.2; }
  .task.on .circle { background: var(--good); border-color: var(--good); }
  .task.on .circle svg { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }
  .task.on .pic { opacity: .4; }
  .task.on .txt { color: var(--muted); text-decoration: line-through; }
  .task.on .txt small { text-decoration: none; }

  /* ---------- Farevarsel ---------- */
  .upper.hasalert .head { height: 36vh; }
  .upper.hasalert .advice { padding: 1.2vh 1.6vw; }
  .upper.hasalert .advice .a1 { font-size: 5vh; }
  .upper.hasalert .advice .a2 { font-size: 3.2vh; margin-top: .4vh; }
  .alerts { display: none; flex: none; align-items: center; height: 9.6vh; margin-top: 1.4vh; padding: 0 1.6vw; border-radius: 1.6vh; border-left: 1vh solid var(--faint); cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .alerts.lv-yellow, .alertbox .lv-yellow { background: rgba(255,209,102,.16); border-left-color: #ffd166; }
  .alerts.lv-orange, .alertbox .lv-orange { background: rgba(255,159,67,.2); border-left-color: #ff9f43; }
  .alerts.lv-red, .alertbox .lv-red { background: rgba(255,92,92,.24); border-left-color: #ff5c5c; }
  .alerts .al-ic { flex: none; width: 6.4vh; height: 6.4vh; margin-right: 1.2vw; }
  .alerts .al-ic svg { width: 100%; height: 100%; display: block; }
  .alerts .al-tx { -webkit-box-flex: 1; flex: 1; min-width: 0; }
  .alerts .al-tx b { display: block; font-size: 4vh; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alerts .al-tx span { display: block; font-size: 2.7vh; color: var(--muted); margin-top: .3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alerts .al-more { flex: none; margin-left: 1.2vw; font-size: 3vh; font-weight: 700; color: var(--text); white-space: nowrap; }
  .alertbox { display: none; position: absolute; left: 2vw; right: 2vw; top: 2.2vh; bottom: 3.4vh; z-index: 20; background: var(--card); border-radius: 2vh; padding: 2.4vh 2vw; overflow: hidden; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .alertbox .it { border-left: 1vh solid var(--faint); border-radius: 1.4vh; padding: 1.4vh 1.4vw; margin-bottom: 1.6vh; }
  .alertbox h4 { font-size: 4vh; line-height: 1.15; }
  .alertbox .when { font-size: 2.8vh; color: var(--muted); margin: .4vh 0 .8vh; }
  .alertbox p { font-size: 3vh; line-height: 1.3; margin-top: .6vh; }
  .alertbox p i { font-style: normal; color: var(--muted); }
  .alertbox .close { position: absolute; right: 2vw; bottom: 1.4vh; font-size: 2.4vh; color: var(--muted); }

  /* ---------- Søppelhenting ---------- */
  .waste { display: none; flex: none; align-items: center; height: 5.8vh; padding: 0 1.1vw 0 .7vw; border-radius: 2.9vh; background: rgba(120,150,180,.12); color: var(--text); font-size: 3.2vh; font-weight: 600; margin-right: 1.4vw; white-space: nowrap; border: .3vh solid transparent; }
  .waste .wi { display: flex; margin-right: .7vw; }
  .waste .wi svg { width: 4.4vh; height: 4.4vh; display: block; margin-right: .3vh; border-radius: .6vh; }
  .waste small { font-size: 2.8vh; font-weight: 400; color: var(--muted); margin-right: .6vw; }
  .waste.soon { background: rgba(255,209,102,.2); border-color: #ffd166; }
  .waste.soon small { color: var(--text); font-weight: 700; }

  /* ---------- Ukeplan: dagens plan og ekstra oppgaver ---------- */
  .col { --c: 8.4vh; --p: 9.6vh; --t: 3.5vh; --s: 2.2vh; }
  .col.d1 { --c: 6.6vh; --p: 7.4vh; --t: 3.1vh; --s: 2vh; }
  .col.d2 { --c: 5.4vh; --p: 5.8vh; --t: 2.8vh; --s: 1.8vh; }
  .task .circle { width: var(--c); height: var(--c); border-width: calc(var(--c) * .11); }
  .task .pic { width: var(--p); height: var(--p); }
  .task .txt { font-size: var(--t); }
  .task .txt small { font-size: var(--s); }
  .plan { display: flex; flex-wrap: wrap; flex: none; margin: 0 0 .4vh; }
  .chip { max-width: 100%; box-sizing: border-box; display: flex; align-items: center; background: rgba(255,209,102,.16); border: .3vh solid #ffd166; border-radius: 2.8vh; padding: .3vh 1vw .3vh .5vw; margin: 0 .6vw .6vh 0; font-size: 3vh; font-weight: 700; }
  .chip svg { width: 4.6vh; height: 4.6vh; margin-right: .5vw; flex: none; display: block; }
  .chip small { font-size: 2.2vh; font-weight: 400; color: var(--muted); margin-left: .6vw; white-space: normal; line-height: 1.15; }
</style>
</head>
<body>
<div class="pager" id="pager"><div class="track" id="track">
<div class="page">
<div class="screen">
  <section class="upper" id="upper">
    <div class="head">
      <div class="hl">
        <div class="mini"><div class="place" id="place"></div><div class="waste" id="waste"></div><div class="warn" id="stale"></div></div>
        <div class="now">
          <div class="icon" id="nowIcon"></div>
          <div class="temp"><span id="nowTemp">--</span><small>°</small></div>
          <div class="meta" id="nowMeta"></div>
        </div>
      </div>
      <div class="kid" id="kid"></div>
      <div class="hr"><div class="clock" id="clock">--:--</div><div class="flagday" id="flagday"></div></div>
    </div>
    <div class="alerts" id="alerts"></div>
    <div class="advice" id="advice"><div class="a1">Henter vær …</div><div class="a2"></div></div>
  </section>

  <section class="lower">
    <div class="hours" id="hours"></div>
    <div class="transit">
      <div class="board" id="b-hauger"><h2><span class="badge metro">3</span>Hauger<span class="sub">mot sentrum</span><span class="walk"></span></h2><div class="rows"></div></div>
    </div>
  </section>
<div class="alertbox" id="alertbox"></div>
</div>
</div>

<div class="page">
  <div class="routine">
    <div class="rtop"><div class="ttl"><i id="rtitle" style="font-style:normal">Morgenrutine</i><span id="rdate"></span></div><div class="rclock" id="rclock">--:--</div></div>
    <div class="cols" id="cols"></div>
  </div>
</div>
</div></div>
<div class="dots" id="dots"><i class="on"></i><i></i></div>

<script>
// ===== Konfigurasjon =====
// walk = gåtid i minutter fra døra til holdeplassen. Avganger du ikke rekker dempes,
// og første du rekker fremheves med "Gå om N min". Sett walk: 0 for å skru av.
var CFG = {
  lat: 59.92, lon: 10.51,                     // Bærum (avrundet)
  clientName: 'privat-gangskjerm',            // Entur ber om et navn på klienten
  boards: [
    { el: 'b-hauger',   stop: 'NSR:StopPlace:58283', quay: 'NSR:Quay:7305', n: 4, walk: 8 }                     // Hauger, T3 mot Oslo
  ],
  rows: 3,                                    // antall avgangsrader (må matche grid i .rows)
  hoursShown: 10,                             // timer som brukes til klesrådet
  hoursAhead: 48,                             // timer i værstripen (kan scrolles)
  dimFrom: 22, dimTo: 6,                      // dimmet visning om natten
  staleAfterMin: 4                            // avganger eldre enn dette markeres som utdatert
};

// Demo: ?demo=1 (regn), ?demo=fog | snow | clear | night | cancel | error | thunder, valgfritt &temp=-5 for å overstyre temperatur
var DEMO = (function () { var m = /[?&]demo=([^&]*)/.exec(location.search); return m ? (m[1] === '1' ? 'rain' : m[1]) : ''; })();

function $(id) { return document.getElementById(id); }
// ===== Norsk tid, uavhengig av tidssonen på nettbrettet =====
var OSLO_FMT = null;
try { OSLO_FMT = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Oslo', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }); } catch (e) { OSLO_FMT = null; }
// Gir en Date der getHours() osv. returnerer klokkeslettet i Norge
function osl(d) {
  if (!OSLO_FMT || !OSLO_FMT.formatToParts) return d;
  var parts = OSLO_FMT.formatToParts(d), v = {}, i;
  for (i = 0; i < parts.length; i++) v[parts[i].type] = parseInt(parts[i].value, 10);
  return new Date(v.year, v.month - 1, v.day, v.hour % 24, v.minute, v.second);
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hhmm(d) { var o = osl(d); return pad(o.getHours()) + ':' + pad(o.getMinutes()); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var fails = { weather: 0, transit: 0 };
var lastOk = { weather: 0, transit: 0 };

// ===== Klokke + dimming =====
// ===== Flaggdager (offisielle, jf. forskrift om flagging) =====

// ===== Avganger (Entur) =====
var departures = {};
function loadTransit() {
  var stops = {};

  var ids = Object.keys(stops), q = '{', i;
  for (i = 0; i < ids.length; i++) {
    q += 's' + i + ':stopPlace(id:"' + ids[i] + '"){estimatedCalls(numberOfDepartures:80,timeRange:10800){realtime cancellation ' +
      'expectedDepartureTime destinationDisplay{frontText} quay{id} serviceJourney{line{publicCode}}}}';
  }
  q += '}';
  fetch('https://api.entur.io/journey-planner/v3/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'ET-Client-Name': CFG.clientName },
    body: JSON.stringify({ query: q })
  })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      var byStop = {};
      ids.forEach(function (id, k) { byStop[id] = (j.data['s' + k] || {}).estimatedCalls || []; });
      CFG.boards.forEach(function (b) {
        // Innstilte avganger beholdes (vises overstreket) så man ikke venter på dem
        departures[b.el] = byStop[b.stop].filter(function (c) {
          return c.quay.id === b.quay && (!b.line || c.serviceJourney.line.publicCode === b.line);
        }).slice(0, b.n + 2);

  if (routine.d !== todayKey()) { routine = { d: todayKey(), c: {} }; saveRoutine(); buildRoutine(); }
  var want = LISTTEST || (o.getHours() >= AFTER_HOUR ? 'after' : 'morning');
  if (want !== curList) { curList = want; TASKS = LISTS[want].tasks; $('rtitle').textContent = LISTS[want].title; buildRoutine(); }
}
loadRoutine(); checkReset();
if (/[?&]page=2/.test(location.search)) go(1, true);

tick(); setInterval(tick, 10000);
loadPlan(); setInterval(loadPlan, 30 * 60e3);
renderWaste(); setInterval(renderWaste, 60e3);
if (ALERTDEMO) setAlerts(demoAlerts(ALERTDEMO)); else { loadAlerts(); setInterval(loadAlerts, 10 * 60e3); }
setInterval(function () { if (ALERTS.length) renderAlerts(); }, 30e3);
if (DEMO) {
  if (DEMO === 'error') { fails.weather = 3; fails.transit = 3; renderWeather(); renderTimes(); updateStale(); }
  else { weatherData = demoWeather(DEMO); lastOk.weather = Date.now(); renderWeather(); demoTransit(DEMO); renderTimes();
    setInterval(function () { demoTransit(DEMO); }, 60e3); }
} else {
  loadWeather(); setInterval(loadWeather, 10 * 60e3);
  loadTransit(); setInterval(loadTransit, 30e3);
  // Last siden på nytt når en ny versjon er publisert, og uansett én gang per natt (etter kl. 04),
  // så nettbrettet aldri blir hengende på gammel kode. Venter til ingen har rørt skjermen på 1 min.
  var loadedDay = todayKey(), loadedSrc = null;
  function safeReload() { if (Date.now() - lastAct > 60e3) location.reload(); }
  function checkVersion() {
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { if (loadedSrc === null) loadedSrc = t; else if (t !== loadedSrc) safeReload(); })
      .catch(function () { });
  }
  checkVersion(); setInterval(checkVersion, 5 * 60e3);
  setInterval(function () { if (todayKey() !== loadedDay && osl(new Date()).getHours() >= 4) safeReload(); }, 60e3);
  // Oppdater med en gang når skjermen våkner igjen
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); checkVersion(); } }, false);
}
</script>
